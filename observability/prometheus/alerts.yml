groups:
  - name: microshop
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.job }} is not answering scrapes"

      - alert: HighErrorRate
        # More than 5% of requests answered with a 5xx over 5 minutes.
        expr: |
          sum by (job) (rate(http_request_duration_seconds_count{status_code=~"5.."}[5m]))
            / sum by (job) (rate(http_request_duration_seconds_count[5m])) > 0.05
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.job }}: {{ $value | humanizePercentage }} of requests fail"

      - alert: SlowRequests
        expr: |
          histogram_quantile(0.95, sum by (job, le) (rate(http_request_duration_seconds_bucket[5m]))) > 0.5
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.job }}: p95 latency above 500 ms"

      - alert: OrdersStuckPending
        # Orders are being created but none settle: the saga is broken (catalog consumer down, queue stuck...).
        expr: |
          sum(increase(shop_orders_created_total[10m])) > 0
            and sum(increase(shop_orders_settled_total[10m])) == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Orders are created but none were confirmed or rejected in 10 minutes"

      - alert: HighRejectionRate
        expr: |
          sum(rate(shop_orders_settled_total{status="REJECTED"}[30m]))
            / sum(rate(shop_orders_settled_total[30m])) > 0.2
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "More than 20% of orders rejected for lack of stock: restock?"

      - alert: LowStock
        expr: shop_product_stock < 3
        labels: { severity: info }
        annotations:
          summary: "{{ $labels.sku }} has {{ $value }} units left"

      - alert: QueueBacklog
        expr: rabbitmq_queue_messages_ready > 100
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Queue {{ $labels.queue }} has {{ $value }} messages waiting"
