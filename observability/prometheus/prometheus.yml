global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: gateway
    static_configs: [{ targets: ["gateway:3000"] }]
  - job_name: orders
    static_configs: [{ targets: ["orders:3000"] }]
  - job_name: catalog
    metrics_path: /metrics/
    static_configs: [{ targets: ["catalog:8000"] }]
  - job_name: notifications
    metrics_path: /metrics/
    static_configs: [{ targets: ["notifications:8000"] }]
  - job_name: rabbitmq
    metrics_path: /metrics/per-object # one series per queue
    static_configs: [{ targets: ["rabbitmq:15692"] }]
